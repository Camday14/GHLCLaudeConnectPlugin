# Render Blueprint: New → Blueprint → pick this repo. Fill in the "sync: false" values when prompted.
services:
  - type: web
    name: ghl-claude-connector
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ghl-connector-db, property: connectionString }
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CONNECT_PASSCODE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_LOCATION_IDS
        sync: false
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
databases:
  - name: ghl-connector-db
    plan: basic-256mb
